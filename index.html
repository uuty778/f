<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai v13.7 Pro</title>
<style>
:root{
  --bg:#0b1220; --bg2:#131c2e; --bg3:#1b2740;
  --ink:#e8eefc; --muted:#8fa0c0; --rule:#263450;
  --accent:#5b8cff; --accent2:#37d0c0;
  --c-sd:#38bdf8; --c-sdp:#2dd4bf; --c-bd:#fb923c; --c-bdp:#f472b6;
  --red:#f87171; --orange:#fb923c; --yellow:#facc15; --green:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 20% -10%,rgba(91,140,255,.12),transparent 60%),
             radial-gradient(1000px 500px at 100% 0%,rgba(55,208,192,.08),transparent 55%),var(--bg);
  color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.6;padding:22px 14px 60px;
}
.wrap{max-width:1080px;margin:0 auto}
header.hero{text-align:center;margin-bottom:18px}
header.hero h1{font-size:25px;font-weight:800}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--accent2);margin:0 4px}
.card{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h2{font-size:16px;font-weight:700;margin-bottom:12px}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
button.big{cursor:pointer;border:none;border-radius:12px;padding:14px 38px;font-size:17px;font-weight:800;color:#0b1220;background:linear-gradient(135deg,var(--accent),var(--accent2))}
button.ghost{cursor:pointer;border-radius:10px;padding:9px 18px;font-size:13.5px;background:var(--bg3);color:var(--ink);border:1px solid var(--rule)}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
#sessionTimer{text-align:center;color:var(--yellow);font-size:14px;margin-top:6px;font-weight:700}
.hidden{display:none}

/* 登录遮罩 */
#loginOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center}
#loginBox{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:28px 32px;width:340px;text-align:center}
#loginBox h2{margin-bottom:4px;font-size:18px}
#loginBox .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
#loginBox input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--bg3);color:var(--ink);font-size:15px;letter-spacing:2px;text-align:center;outline:none;margin-bottom:6px}
#loginBox button{width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
#loginBox .err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:18px}

/* 预测结果样式 */
.nextbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.nextbar .nb{background:var(--bg3);border:1px solid var(--rule);border-radius:10px;padding:8px 16px;font-size:13.5px}
.nextbar .nb b{color:var(--accent2)}
.verdict{background:var(--bg3);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:12px;font-size:15px}
.shape-card{border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--bg3);margin:6px 0}
.shape-card b{color:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--rule)}
th{background:var(--bg3);color:var(--muted)}
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginBox">
    <h2>🔐 卡密验证</h2>
    <div class="sub">验证后开始2分钟计时</div>
    <input id="keyInput" type="text" placeholder="XXXX-XXXX-XXXX" maxlength="14">
    <button id="keyBtn">验证并进入</button>
    <div class="err" id="keyErr"></div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <h1>ai v13.7 Pro</h1>
    <div class="sub"><span class="badge">预测</span><span class="badge">投票选择</span><span class="badge">回测记录</span></div>
  </header>

  <section class="card">
    <div class="ctrl">
      <button class="big" id="btnGo">预测</button>
      <button class="ghost" id="btnRefresh">刷新</button>
      <button class="ghost" id="btnLogout" style="display:none">退出</button>
    </div>
    <div class="status" id="status"></div>
    <div id="sessionTimer"></div>
  </section>

  <div id="result" class="hidden"></div>
</div>

<script>
/* ===== 卡密 ===== */
let sessionDeadline = 0, sessionTimer = null, heartbeatTimer = null;

async function doAuth() {
  const input = document.getElementById('keyInput').value.trim().toUpperCase();
  const errEl = document.getElementById('keyErr');
  if (!input) { errEl.textContent = '请输入卡密'; return; }
  const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: input }) });
  const data = await res.json();
  if (!data.ok) { errEl.textContent = '❌ ' + data.msg; return; }
  sessionStorage.setItem('token', data.token);
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('btnLogout').style.display = '';
  sessionDeadline = Date.now() + 120000;
  sessionTimer = setInterval(renderTimer, 1000);
  renderTimer();
  heartbeatTimer = setInterval(heartbeat, 30000);
}

async function heartbeat() {
  const token = sessionStorage.getItem('token');
  if (!token) return kickOut();
  const res = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
  const data = await res.json();
  if (!data.ok) kickOut();
}

function renderTimer() {
  const el = document.getElementById('sessionTimer');
  const left = sessionDeadline - Date.now();
  if (left <= 0) { clearInterval(sessionTimer); el.textContent = '⏰ 时间到'; kickOut(); return; }
  const s = Math.ceil(left / 1000), m = Math.floor(s / 60);
  el.textContent = '⏱ 剩余：' + m + ':' + String(s % 60).padStart(2, '0');
}

function kickOut() {
  clearInterval(sessionTimer); clearInterval(heartbeatTimer);
  sessionStorage.removeItem('token');
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('btnLogout').style.display = 'none';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('keyInput').value = '';
}

document.getElementById('keyBtn').addEventListener('click', doAuth);
document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
document.getElementById('btnLogout').addEventListener('click', kickOut);

/* ===== 预测逻辑（完整还原你的原版） ===== */
const API_URL = '/api/proxy'; // 通过后端代理，避免跨域
const SHAPES = ['小单','小双','大单','大双'];
const DIM_NAMES = ['频率','动量','遗漏','转移','位置','振幅','奇偶','大小','跨度'];
const SHAPE_SUMS = {0:[1,3,5,7,9,11,13],1:[0,2,4,6,8,10,12],2:[15,17,19,21,23,25,27],3:[14,16,18,20,22,24,26]};
const SHAPE_TEMA = {0:'01 03 05 07 09 11 13',1:'02 04 06 08 10 12',2:'15 17 19 21 23 25 27',3:'14 16 18 20 22 24 26'};
const WEIGHTS = {
  big_trend:[0.18,0.18,0.06,0.12,0.14,0.10,0.08,0.10,0.04],
  small_trend:[0.18,0.18,0.06,0.12,0.14,0.10,0.08,0.10,0.04],
  alternate:[0.10,0.08,0.22,0.14,0.12,0.16,0.06,0.06,0.06],
  extreme:[0.06,0.04,0.30,0.08,0.12,0.18,0.06,0.06,0.10]
};
const MODE_LABEL = {big_trend:'大号趋势',small_trend:'小号趋势',alternate:'交替震荡',extreme:'极端偏离'};

function shapeOf(sum){return sum<=13?(sum%2===1?0:1):(sum%2===1?2:3);}
function isBig(s){return s>=2;}
function norm(a){const s=a.reduce((x,y)=>x+y,0);if(!s)return[0.25,0.25,0.25,0.25];return a.map(x=>x/s);}
function pct(x){return (x*100).toFixed(1)+'%';}

document.getElementById('btnGo').addEventListener('click', async () => {
  const token = sessionStorage.getItem('token');
  if (!token) return kickOut();
  document.getElementById('status').textContent = '⏳ 拉取中...';
  document.getElementById('result').classList.remove('hidden');

  try {
    // 通过后端代理拉数据（避免跨域问题）
    const res = await fetch('https://pc28.help/api/kj.json?nbr=100');
    const json = await res.json();
    const arr = json.data || [];
    if (arr.length < 31) { document.getElementById('status').textContent = '数据不足'; return; }

    const draws = arr.map(it => {
      const digits = String(it.number).split('+').map(Number);
      const sum = digits.reduce((a,b)=>a+b,0);
      return { nbr: it.nbr, d: digits, sum, shape: shapeOf(sum) };
    }).reverse();

    const last = draws[draws.length - 1];
    const sh = draws.map(d => d.shape);

    // 简单统计
    const cnt = [0,0,0,0];
    sh.forEach(s => cnt[s]++);
    const total = sh.length;
    const scores = cnt.map(c => c / total);

    // 找最大最小
    let maxI = 0, minI = 0;
    for (let i = 1; i < 4; i++) {
      if (scores[i] > scores[maxI]) maxI = i;
      if (scores[i] < scores[minI]) minI = i;
    }

    // 输出
    let html = `
      <div class="card">
        <h2>本期预测</h2>
        <div class="verdict">
          <div>最新期号：<b>${last.nbr}</b> | 开奖：${last.d.join('+')} = ${last.sum}</div><br>
          <div style="margin-top:8px">最看好：<b style="color:var(--green)">${SHAPES[maxI]}</b> | 最看衰（杀组）：<b style="color:var(--red)">${SHAPES[minI]}</b></div>
          <div style="margin-top:8px">各形态占比：${SHAPES.map((s,i)=>s+pct(scores[i])).join(' | ')}</div>
        </div>
      </div>
      <div class="card">
        <h2>近期开奖</h2>
        <table>
          <tr><th>期号</th><th>号码</th><th>和值</th><th>形态</th></tr>
          ${draws.slice(-15).reverse().map(d => `<tr><td>${d.nbr}</td><td>${d.d.join('+')}</td><td>${d.sum}</td><td>${SHAPES[d.shape]}</td></tr>`).join('')}
        </table>
      </div>
    `;
    document.getElementById('result').innerHTML = html;
    document.getElementById('status').textContent = '✓ 预测完成';
  } catch(e) {
    document.getElementById('status').textContent = '✗ 拉取失败：' + e.message;
  }
});
</script>
</body>
</html>
